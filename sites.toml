# One entry per live public site. `sitewatch run` crawls each from its
# homepage, same-host only, and screenshots every HTML page it finds.
[[site]]
name = "MatchScout"
base_url = "https://matchscout.co.uk"
# Live sports data: fixtures/results/expected-goals numbers on these pages
# change every day (sometimes every hour) with no code change involved --
# pixel-diffing them flags a "regression" on essentially every run, which
# is noise, not a signal. Static pages (about, privacy, etc.) are still
# fully visual-diffed. See sitewatch's own README/memory for why.
visual_exclude = ["/", "/?division=*", "/all", "/all?*", "/european", "/european?*"]
# gamblingtherapy.org (linked from /responsible-gambling) is confirmed
# genuinely flaky on their end -- a real 502 seen 2026-09-21 -- not
# something fixable on our side. See link_ignore_hosts's own docstring
# in config.py.
link_ignore_hosts = ["www.gamblingtherapy.org"]

[[site]]
name = "StrategyAudit"
base_url = "https://audit.tronk.co.uk"

[[site]]
name = "SignalMarketplace"
base_url = "https://signals.tronk.co.uk"

[[site]]
name = "PrivacyScan"
base_url = "https://privacyscan.co.uk"
# /research is a standing, periodically-rescanned compliance index --
# the headline stats and "updated <date>" line change on their own
# schedule with no code change involved, same live-data pattern as
# MatchScout's fixtures above. Confirmed real 2026-09-21: a flagged
# "3.1% visual regression" was genuinely just the panel's own numbers
# (28/55 -> 2?/55, sector ordering, the updated date) refreshing between
# scans, not a rendering bug.
visual_exclude = ["/research"]
# Same gamblingtherapy.org flakiness as MatchScout above -- confirmed
# genuinely slow/timing out on 2026-09-19 from this site too.
link_ignore_hosts = ["www.gamblingtherapy.org"]
