[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewatch"
version = "0.1.0"
description = "Crawl + link-check + visual-regression watch for the live site fleet (MatchScout, StrategyAudit, SignalMarketplace, PrivacyScan)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "pillow>=10.3",
    "jinja2>=3.1",
    # Spoken/readable fingerprints for `sitewatch accept` -- confirms a
    # baseline promoted from a downloaded CI artifact is actually the file
    # CI produced (a truncated download, a stale re-download), not a
    # security/tamper-detection tool. See odu_core.fingerprint's own
    # docstring for why that boundary matters.
    "odu-core>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx needed for fastapi.testclient.TestClient
# The interactive chat bot (sitewatch.web) -- kept separate from the base
# install so CI's `pip install -e .` for `sitewatch run`/`accept` stays
# lightweight; only the Fly-deployed bot needs these.
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "sentry-sdk>=2.0"]

[project.scripts]
sitewatch = "sitewatch.cli:main"

[tool.setuptools.packages.find]
include = ["sitewatch*"]
