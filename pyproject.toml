[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewatch"
version = "0.1.0"
description = "Crawl + link-check + visual-regression watch for the live site fleet (MatchScout, StrategyAudit, SignalMarketplace, PrivacyScan)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "pillow>=10.3",
    "jinja2>=3.1",
    # Spoken/readable fingerprints for `sitewatch accept` -- confirms a
    # baseline promoted from a downloaded CI artifact is actually the file
    # CI produced (a truncated download, a stale re-download), not a
    # security/tamper-detection tool. See odu_core.fingerprint's own
    # docstring for why that boundary matters.
    "odu-core>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sitewatch = "sitewatch.cli:main"

[tool.setuptools.packages.find]
include = ["sitewatch*"]
