name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject-based, not requirements.txt -- web+dev extras cover both
      # the CLI's own tests and sitewatch.web's (the Fly-deployed bot).
      - run: pip install -e ".[web,dev]"
      - run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t sitewatch:ci .
      - name: Run and verify it actually serves
        run: |
          docker run -d --name smoke -p 8000:8000 sitewatch:ci
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs smoke
          [ "$code" = "200" ] || { echo "app did not come up healthy (last code: $code)"; exit 1; }
      - name: Confirm the container actually runs as non-root
        run: |
          uid=$(docker exec smoke id -u)
          [ "$uid" != "0" ] || { echo "container is running as root"; exit 1; }
          echo "running as uid $uid"
      - if: always()
        run: docker rm -f smoke || true
