name: fleet-sweep
on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays 07:00 UTC -- an hour after tronk-audit's sweep
  workflow_dispatch:
    inputs:
      site:
        description: "Limit to one site slug (blank = every configured site)"
        required: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits the refreshed dashboard + history back to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sitewatch + Chromium
        run: |
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run the sweep
        # Exits non-zero when anything's flagged -- that's the notification:
        # a red run in Actions (and email, if repo notifications are on).
        # `site` is only set on a workflow_dispatch triggered from the chat
        # bot's "sweep <site>" command; the scheduled run always covers everything.
        run: |
          sitewatch run --max-pages 60 --max-depth 4 --fail-on-issues \
            ${{ github.event.inputs.site && format('--site {0}', github.event.inputs.site) || '' }}

      - name: Post summary
        if: always()
        run: |
          run_dir=$(ls -td reports/*/ | head -1)
          cat "${run_dir}summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the dashboard (GitHub Pages, served from main)
        if: always()
        run: |
          git config user.name "sitewatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html history.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "sitewatch: dashboard update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewatch-report
          path: reports/
          retention-days: 90
