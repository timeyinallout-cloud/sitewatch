name: fleet-sweep
on:
  schedule:
    - cron: "0 7 * * 1"      # Mondays 07:00 UTC -- an hour after tronk-audit's sweep
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sitewatch + Chromium
        run: |
          pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run the sweep
        # Exits non-zero when anything's flagged -- that's the notification:
        # a red run in Actions (and email, if repo notifications are on).
        run: sitewatch run --max-pages 60 --max-depth 4 --fail-on-issues

      - name: Post summary
        if: always()
        run: |
          run_dir=$(ls -td reports/*/ | head -1)
          cat "${run_dir}summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewatch-report
          path: reports/
          retention-days: 90
